name: V2 Package Validation

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore KubeJob.sln

      - name: Build
        run: dotnet build KubeJob.sln --configuration Release --no-restore

      - name: Pack all V2 packages
        env:
          PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: bash eng/pack-v2.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: kubejob-v2-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
