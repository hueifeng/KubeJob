name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: kubejob-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KUBEJOB_TEST_POSTGRES: Host=localhost;Port=5432;Username=kubejob;Password=kubejob-dev;Database=postgres
      KUBEJOB_REQUIRE_POSTGRES: "1"
      KUBEJOB_RABBITMQ_TEST_CONNECTION: amqp://kubejob:kubejob-dev@localhost:5672/
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kubejob
          POSTGRES_USER: kubejob
          POSTGRES_PASSWORD: kubejob-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubejob -d kubejob"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: kubejob
          RABBITMQ_DEFAULT_PASS: kubejob-dev
          RABBITMQ_DEFAULT_VHOST: /
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
    - uses: actions/checkout@v4

    - name: Validate local development tooling
      shell: bash
      run: |
        bash -n \
          scripts/dev-stack.sh \
          scripts/run-unified-sample.sh \
          scripts/seed-dashboard-demo.sh
        docker compose -f compose.yaml config >/dev/null
        pwsh -NoProfile -Command '
          $files = @(
            "scripts/dev-stack.ps1",
            "scripts/run-unified-sample.ps1",
            "scripts/seed-dashboard-demo.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore KubeJob.sln

    - name: Build
      shell: bash
      run: |
        mkdir -p artifacts/ci
        set -o pipefail
        dotnet build KubeJob.sln --no-restore --configuration Release 2>&1 \
          | tee artifacts/ci/build.log

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-build-log
        path: artifacts/ci/build.log
        if-no-files-found: warn
        retention-days: 7

    - name: Test
      shell: bash
      run: |
        mkdir -p artifacts/ci
        set -o pipefail
        dotnet test KubeJob.sln --no-build --verbosity normal --configuration Release 2>&1 \
          | tee artifacts/ci/test.log

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-test-log
        path: artifacts/ci/test.log
        if-no-files-found: warn
        retention-days: 7
