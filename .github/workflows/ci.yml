name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore KubeJob.sln

    - name: Build
      shell: bash
      run: |
        mkdir -p artifacts/ci
        set -o pipefail
        dotnet build KubeJob.sln --no-restore --configuration Release 2>&1 \
          | tee artifacts/ci/build.log

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-build-log
        path: artifacts/ci/build.log
        if-no-files-found: warn
        retention-days: 7

    - name: Test
      shell: bash
      run: |
        mkdir -p artifacts/ci
        set -o pipefail
        dotnet test KubeJob.sln --no-build --verbosity normal --configuration Release 2>&1 \
          | tee artifacts/ci/test.log

    - name: Upload test log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ci-test-log
        path: artifacts/ci/test.log
        if-no-files-found: warn
        retention-days: 7
