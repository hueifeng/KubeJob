name: V2 API Security

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attempt-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore tests/KubeJob.ApiTests/KubeJob.ApiTests.csproj

      - name: Test attempt query surface
        run: >-
          dotnet test tests/KubeJob.ApiTests/KubeJob.ApiTests.csproj
          --configuration Release
          --logger "console;verbosity=detailed"
