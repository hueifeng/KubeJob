name: V2 PostgreSQL Integration

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KUBEJOB_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres;Include Error Detail=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore KubeJob.sln

      - name: Build
        run: dotnet build KubeJob.sln --configuration Release --no-restore

      - name: PostgreSQL runtime tests
        run: >-
          dotnet test tests/KubeJob.Tests/KubeJob.Tests.csproj
          --configuration Release
          --no-build
          --filter FullyQualifiedName~PostgreSqlRuntimeIntegrationTests
          --logger "console;verbosity=detailed"
