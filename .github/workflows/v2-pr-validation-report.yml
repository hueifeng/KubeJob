name: V2 PR Validation Report

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KUBEJOB_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres;Include Error Detail=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - id: restore
        name: Restore
        continue-on-error: true
        run: dotnet restore KubeJob.sln

      - id: build
        name: Build
        if: always() && steps.restore.outcome == 'success'
        continue-on-error: true
        run: dotnet build KubeJob.sln --configuration Release --no-restore

      - id: test
        name: Test
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: >-
          dotnet test tests/KubeJob.Tests/KubeJob.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

      - id: pack
        name: Pack
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          PACKAGE_VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}
        run: bash eng/pack-v2.sh

      - name: Report validation result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PACK_OUTCOME: ${{ steps.pack.outcome }}
        with:
          script: |
            const marker = '<!-- kubejob-v2-validation -->';
            const icon = value => value === 'success' ? '✅' : value === 'skipped' ? '⏭️' : '❌';
            const body = `${marker}\n## KubeJob V2 validation\n\n` +
              `| Stage | Result |\n|---|---|\n` +
              `| Restore | ${icon(process.env.RESTORE_OUTCOME)} ${process.env.RESTORE_OUTCOME} |\n` +
              `| Build | ${icon(process.env.BUILD_OUTCOME)} ${process.env.BUILD_OUTCOME} |\n` +
              `| Test (including PostgreSQL) | ${icon(process.env.TEST_OUTCOME)} ${process.env.TEST_OUTCOME} |\n` +
              `| Pack all V2 packages | ${icon(process.env.PACK_OUTCOME)} ${process.env.PACK_OUTCOME} |\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail workflow when validation failed
        if: >-
          always() &&
          (steps.restore.outcome != 'success' ||
           steps.build.outcome != 'success' ||
           steps.test.outcome != 'success' ||
           steps.pack.outcome != 'success')
        run: exit 1
