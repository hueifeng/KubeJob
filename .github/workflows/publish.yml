name: Publish to NuGet

on:
  workflow_run:
    workflows: ["CI"] # 监听名为 CI 的 workflow
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0). If empty, uses Directory.Build.props'
        required: false
        type: string

jobs:
  publish:
    # 只有当触发它的 CI 成功运行完毕，或者是手动触发时，才执行发布
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KUBEJOB_TEST_POSTGRES: Host=localhost;Port=5432;Username=kubejob;Password=kubejob-dev;Database=postgres
      KUBEJOB_REQUIRE_POSTGRES: "1"
      KUBEJOB_RABBITMQ_TEST_CONNECTION: amqp://kubejob:kubejob-dev@localhost:5672/
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kubejob
          POSTGRES_USER: kubejob
          POSTGRES_PASSWORD: kubejob-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubejob -d kubejob"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: kubejob
          RABBITMQ_DEFAULT_PASS: kubejob-dev
          RABBITMQ_DEFAULT_VHOST: /
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Determine Version
      id: get_version
      run: |
        VERSION=""
        if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION=${{ github.event.inputs.version }}
        fi
        
        if [ -n "$VERSION" ]; then
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version set to: $VERSION"
        else
          echo "No explicit version provided. Will use version from Directory.Build.props."
        fi

    - name: Restore dependencies
      run: dotnet restore KubeJob.sln

    - name: Build
      run: dotnet build KubeJob.sln -c Release --no-restore

    - name: Test
      run: dotnet test KubeJob.sln -c Release --no-build --verbosity normal

    - name: Validate packages and generator diagnostics
      run: |
        CONFIGURATION=Release \
        PACKAGE_VERSION="${PACKAGE_VERSION:-0.0.0-publish-validation}" \
        bash eng/validate-v2-complete.sh

    - name: Pack
      run: |
        if [ -n "$PACKAGE_VERSION" ]; then
          dotnet pack KubeJob.sln -c Release --no-build -o ./artifacts /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
        else
          dotnet pack KubeJob.sln -c Release --no-build -o ./artifacts
        fi

    - name: Push to NuGet
      run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
