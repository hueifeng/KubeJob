name: V2 Generator Negative Tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-job-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore negative fixture
        run: dotnet restore tests/KubeJob.GeneratorNegative/KubeJob.GeneratorNegative.csproj

      - name: Require KJGEN003
        shell: bash
        run: |
          set +e
          output=$(dotnet build tests/KubeJob.GeneratorNegative/KubeJob.GeneratorNegative.csproj --configuration Release --no-restore 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "Expected duplicate key compilation to fail."
            exit 1
          fi

          if ! grep -q "KJGEN003" <<< "$output"; then
            echo "Compilation failed, but not because of KJGEN003."
            exit 1
          fi
