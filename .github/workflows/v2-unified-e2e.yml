name: V2 Unified End-to-End

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore tests/KubeJob.EndToEndTests/KubeJob.EndToEndTests.csproj

      - name: Execute unified runtime test
        run: >-
          dotnet test tests/KubeJob.EndToEndTests/KubeJob.EndToEndTests.csproj
          --configuration Release
          --logger "console;verbosity=detailed"
