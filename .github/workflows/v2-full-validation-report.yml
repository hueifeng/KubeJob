name: V2 Full Validation Report

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KUBEJOB_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres;Include Error Detail=true
      PACKAGE_VERSION: 0.0.0-full.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - id: validate
        name: Run complete V2 validation
        continue-on-error: true
        run: bash eng/validate-v2.sh

      - name: Report validation result
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const marker = '<!-- kubejob-v2-full-validation -->';
            const success = process.env.VALIDATION_OUTCOME === 'success';
            const body = `${marker}\n## KubeJob V2 full validation\n\n` +
              `${success ? '✅' : '❌'} **${process.env.VALIDATION_OUTCOME}**\n\n` +
              `Validated in one runner:\n` +
              `- solution restore and Release build\n` +
              `- unit/reference runtime tests\n` +
              `- ASP.NET API security test\n` +
              `- real PostgreSQL race tests\n` +
              `- duplicate JobKey negative compilation\n` +
              `- all V2 NuGet packages\n` +
              `- packed Core package consumer and generated Jobs key\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail workflow when validation failed
        if: always() && steps.validate.outcome != 'success'
        run: exit 1
