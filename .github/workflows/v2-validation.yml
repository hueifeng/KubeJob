name: V2 Validation

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore KubeJob.sln

      - name: Build
        run: dotnet build KubeJob.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/KubeJob.Tests/KubeJob.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"
