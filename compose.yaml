name: kubejob-dev

# Local development dependencies only. Production deployments should provide
# their own credentials, persistence, backups, networking, and TLS settings.
services:
  postgres:
    image: postgres:${KUBEJOB_POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KUBEJOB_POSTGRES_DB:-kubejob}
      POSTGRES_USER: ${KUBEJOB_POSTGRES_USER:-kubejob}
      POSTGRES_PASSWORD: ${KUBEJOB_POSTGRES_PASSWORD:-kubejob-dev}
    ports:
      - "${KUBEJOB_POSTGRES_PORT:-5432}:5432"
    volumes:
      - kubejob-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:${KUBEJOB_RABBITMQ_VERSION:-4-management-alpine}
    restart: unless-stopped
    hostname: kubejob-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${KUBEJOB_RABBITMQ_USER:-kubejob}
      RABBITMQ_DEFAULT_PASS: ${KUBEJOB_RABBITMQ_PASSWORD:-kubejob-dev}
      RABBITMQ_DEFAULT_VHOST: ${KUBEJOB_RABBITMQ_VHOST:-/}
    ports:
      - "${KUBEJOB_RABBITMQ_PORT:-5672}:5672"
      - "${KUBEJOB_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - kubejob-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka:
    image: bitnami/kafka:${KUBEJOB_KAFKA_VERSION:-3.6}
    restart: unless-stopped
    hostname: kubejob-kafka
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kubejob-kafka:9093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KUBEJOB_KAFKA_PORT:-9092}:9092"
    volumes:
      - kubejob-kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  kubejob-postgres-data:
  kubejob-rabbitmq-data:
  kubejob-kafka-data:
